<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Hood — игра</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1d1a; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #hint {
      position: fixed; left: 12px; bottom: 12px; padding: 6px 10px;
      font: 14px sans-serif; color: #eee; background: rgba(0,0,0,.55); border-radius: 6px;
    }
    #credits {
      position: fixed; right: 8px; bottom: 8px; padding: 2px 6px;
      font: 11px sans-serif; color: #ddd; background: rgba(0,0,0,.45); border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">WASD / стрелки — идти, Shift — бежать, колесо мыши — масштаб</div>
  <div id="credits">© OpenStreetMap contributors (ODbL) · © LGLN (dl-de/by-2-0)</div>

  <!-- Порядок важен: сначала данные карты, потом код, который их рисует -->
  <script src="js/map-data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/view-3d.js"></script>
  <script src="js/player.js"></script>
  <script src="js/pickups.js"></script>
  <script src="js/police.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
